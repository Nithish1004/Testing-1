{% extends 'account/auth_base.html' %}
{% load tailwind_filters %}

{% block content %}

<!-- FULL PAGE NAVY BLUE BACKGROUND -->
<div class="min-h-screen w-full flex items-center justify-center 
            bg-gradient-to-br from-blue-900 via-blue-800 to-blue-900">

    <!-- WHITE SIGNUP CARD -->
    <div class="w-full max-w-md bg-white p-10 rounded-3xl shadow-2xl mx-4">

        <div class="flex justify-center mb-6">
            <h1 class="text-4xl font-extrabold text-blue-700">
                Freelancers
            </h1>
        </div>

        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
            Create your account
        </h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}

            <button 
                type="submit"
                class="w-full py-3 bg-blue-700 text-white font-semibold 
                       rounded-xl hover:bg-blue-800 transition 
                       transform hover:scale-[1.02] shadow-md">
                Sign up
            </button>
        </form>

        <p class="text-center text-gray-700 mt-6">
            Already have an account?
            <a href="{% url 'account_login' %}" 
               class="text-blue-700 font-semibold hover:underline">
                Sign in
            </a>
        </p>

    </div>
</div>

{% endblock content %}
