{% extends "jobs/_base.html" %}

{% block content %}
<h2 class="text-2xl font-bold mb-6">My Posted Jobs</h2>

<div class="space-y-4">
    {% for job in jobs %}
        <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between">
            <div>
                <h3 class="text-xl font-semibold text-blue-600">{{ job.title }}</h3>
                <p class="text-gray-700 mt-1">{{ job.description|truncatewords:20 }}</p>
                <p class="text-gray-600 mt-1">Budget: ₹{{ job.budget }}</p>
            </div>
            <div>
                <a href="{% url 'manage-applications' job.id %}" 
                   class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    View Applicants
                </a>
            </div>
        </div>
    {% empty %}
        <p class="text-gray-500">You have not posted any jobs yet.</p>
    {% endfor %}
</div>
{% endblock %}
