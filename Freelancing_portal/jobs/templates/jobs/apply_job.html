{% extends "jobs/_base.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Apply for Job</h2>
    <p class="text-gray-700 mb-6"><strong>{{ job.title }}</strong></p>
    <p class="text-gray-600 mb-6">{{ job.description }}</p>

    <form method="POST">
        {% csrf_token %}
        <p class="mb-4 text-gray-700">Are you sure you want to apply for this job?</p>
        <div class="flex gap-4">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                Yes, Apply
            </button>
            <a href="{% url 'job-list' %}" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
