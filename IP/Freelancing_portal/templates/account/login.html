{% extends 'jobs/_base.html' %}
{% load tailwind_filters %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-lg">

        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <h1 class="text-4xl font-bold text-blue-700">Freelancers</h1>
        </div>

        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
            Sign in
        </h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}

            <button 
                type="submit"
                class="w-full py-3 text-white bg-blue-700 font-medium rounded-lg hover:bg-blue-800 transition">
                Sign in
            </button>
        </form>

        <p class="text-center text-gray-600 mt-6">
            New to the site? 
            <a href="{% url 'account_signup' %}" class="text-blue-600 font-medium hover:underline">
                Create an account
            </a>
        </p>
    </div>
</div>
{% endblock content %}
