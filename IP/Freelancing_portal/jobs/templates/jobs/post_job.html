{% extends 'jobs/_base.html' %}

{% block content %}
<div class="flex justify-center mt-12">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-lg">
    <h2 class="text-2xl font-semibold mb-6 text-center">Post a New Job</h2>

    <form method="POST" class="space-y-5">
      {% csrf_token %}
      <div>
        <label for="title" class="block text-gray-700 mb-1">Job Title</label>
        <input type="text" id="title" name="title" required
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="description" class="block text-gray-700 mb-1">Description</label>
        <textarea id="description" name="description" rows="4" required
                  class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div>
        <label for="budget" class="block text-gray-700 mb-1">Budget (in ₹)</label>
        <input type="number" id="budget" name="budget" required min="1"
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200">
        Post Job
      </button>
    </form>
  </div>
</div>
{% endblock %}
